# Minimal config for testing. 2 cues, 2 reps, 1 batch.
paths:
  cue_stats_path: "lexicon/SWOW-EN18/cueStats.SWOW-EN.R123.20180827.csv"
  raw_output_path: "data/raw/test_small_responses.csv"
  processed_output_path: "data/processed/test_small_processed.csv"
  edge_list_output_path: "data/processed/test_small_edges.csv"
  dataset_name: "test_small"

sampling:
  num_cues: 2
  seed: 42

generation:
  model: "gpt-4o-mini"
  max_tokens: 64
  temperature: 0.0
  repetitions_per_cue: 2
  request_timeout_sec: 60
  api_provider: "openai"
  api_base_url: "https://api.openai.com"
  batch_request_limit: 10
  batch_poll_interval_sec: 2
  batch_timeout_sec: 300
  run_root_dir: "data/runs"
  checkpoint_every_n_results: 5
  campaign_name: ""
  campaign_root_dir: "data/campaigns"
  cue_start_index: 0
  cue_count: 0
  master_seed: 42
  max_open_batches: 2
  submission_mode: "incremental"

processing:
  repetitions_per_cue: 2
  seed: 42
